[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oncoscope"
version = "0.1.0"
description = "LLM harness orchestrating vision models for cancer detection in medical images, with a gated self-improvement loop."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sienna Chen", email = "siennakchen@gmail.com" }]
dependencies = [
    "numpy>=1.26",
    "pydicom>=2.4",
    "pyyaml>=6.0",
    "pydantic>=2.5",
]

[project.optional-dependencies]
agent = ["claude-agent-sdk>=0.1.0"]
# Pinned to a commit so "which harness produced this number" has one answer.
# Bump deliberately; results files record the ref they ran against.
harness = ["oncoharness @ git+https://github.com/siennakc/Onco-Harness@0293cd025ad5295876376daaea90189dcada7957"]
serving = ["fastapi>=0.110", "uvicorn>=0.29"]
# CAMELYON16 foundation-model lane (embed_c16_fm.py / train_abmil.py)
# tiffslide/tifffile are PINNED: scripts/bench/remote_slide.py relies on their
# internals (series levels, page dataoffsets, is_jfif) and was verified
# pixel-exact against these exact versions. Re-run tests/test_remote_slide.py
# before bumping either.
fm = ["torch>=2.4", "torchvision>=0.19", "timm>=1.0", "transformers>=4.45",
      "huggingface_hub>=0.25", "tiffslide==4.0.0", "tifffile==2026.9.9",
      "imagecodecs>=2024.1", "requests>=2.31", "pillow>=10"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
